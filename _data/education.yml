# Education page entries, shown newest first in the order listed here.
#
# Fields:
#   degree        Card title.
#   school        Institution name (links to school_url).
#   school_url    Institution homepage.
#   dept_url      Where the round arrow button goes.
#   dept_label    Accessible label for the arrow button.
#   period        Dates as displayed, e.g. "Fall 2024 – Present" or "June 2021".
#   location      City, region, country.
#   gpa           Optional, e.g. "3.90/4.00".
#   status        "current" (green pulsing badge) or "graduated".
#   logo          File in images/logos/.
#   photo         Optional file in images/campus/, shown on hover.
#   photo_position Optional CSS object-position for the photo, e.g. "50% 80%".

